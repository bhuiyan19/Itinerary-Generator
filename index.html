<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goFLY Ticket Generator</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="logo-section">
                    <h1>goFLY Limited</h1>
                    <p class="tagline">...let you fly</p>
                </div>
                <div class="header-info">
                    <p>Office Address: 1/1, Shukrabad, Dhaka 1207</p>
                    <p>(Beside New Model College / Opposite of Metro Shopping Mall)</p>
                    <p>For Support: Ask@goflybd.com | After-Sales: Service@goflybd.com</p>
                </div>
            </div>
        </header>

        <main>
            <div class="input-section">
                <h2 class="section-title">Paste Your Ticket Data</h2>
                <textarea id="ticketInput" placeholder="Copy and paste your ticket information from any vendor here...&#10;&#10;The system will automatically detect and parse:&#10;- Malaysia Airlines tickets&#10;- Qatar Airways tickets&#10;- Novair tickets&#10;- And other formats"></textarea>
                <div class="button-group">
                    <button id="parseBtn" class="btn btn-primary">Parse & Preview</button>
                    <button id="clearBtn" class="btn btn-secondary">Clear</button>
                </div>
            </div>

            <div id="previewSection" class="preview-section" style="display: none;">
                <h2 class="section-title">Ticket Preview</h2>
                <div id="ticketPreview" class="ticket-preview">
                    <!-- Ticket preview will be generated here -->
                </div>
                <div class="button-group">
                    <button id="generatePdfBtn" class="btn btn-success">Generate PDF</button>
                    <button id="editBtn" class="btn btn-secondary">Edit Data</button>
                </div>
            </div>

            <div id="errorSection" class="error-section" style="display: none;">
                <div class="error-message">
                    <h3>⚠️ Parsing Error</h3>
                    <p id="errorMessage"></p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Cache buster - ensure latest version of JS files are loaded
        const cacheBuster = Date.now();
        ['js/parser.js', 'js/pdfGenerator.js', 'js/app.js'].forEach(src => {
            const script = document.createElement('script');
            script.src = src + '?v=' + cacheBuster;
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
