<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parser Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        pre { background: #f5f5f5; padding: 10px; border: 1px solid #ddd; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>goFLY Ticket Parser - Debug Mode</h1>

    <h2>Test Data:</h2>
    <pre id="testData"></pre>

    <h2>Parsed Result:</h2>
    <pre id="result"></pre>

    <h2>Flight Details:</h2>
    <div id="flightDetails"></div>

    <script>
        // Cache buster - force reload of parser.js
        const script = document.createElement('script');
        script.src = 'js/parser.js?v=' + Date.now();
        document.head.appendChild(script);

        script.onload = function() {
            runTest();
        };

        function runTest() {
        const testData = `Electronic Ticket Receipt Booking ref 7P6MEI
22 January 26
Traveler Ticket Number Issuing Airline
- Mr Md Shifat 157-2132963822 Qatar Airways

Thursday 05 February 2026
Qatar Airways QR 639 (Operated By Qatar Airways, QR)
Departure
05 February 19:15 HAZRAT SHAHJALAL INTL DHAKA Terminal : 1
Arrival
05 February 22:20 HAMAD INTERNATIONAL DOHA
Duration
06:05h (Non Stop)
Class
Economy (N)
Equipment Boeing 777-300Er
Baggage Allowance 25K for Mr Md Shifat

Friday 06 February 2026
Qatar Airways QR 123 (Operated By Qatar Airways, QR)
Departure
06 February 02:35 HAMAD INTERNATIONAL DOHA
Arrival
06 February 06:55 MALPENSA MILAN Terminal : 1
Duration
06:20h (Non Stop)
Class
Economy (N)
Equipment Airbus A350-900
Baggage Allowance 25K for Mr Md Shifat

Air Fare : BDT 94364
Tax : BDT 500BD BDT 444E5 BDT 4000OW BDT 1228P7 BDT 1228P8 BDT 6000UT BDT 2022G4 BDT 184PZ BDT 2022QA BDT 337R9
Total Amount : BDT 112329`;

        document.getElementById('testData').textContent = testData;

        try {
            const parser = new TicketParser(testData);
            const result = parser.parse();

            document.getElementById('result').textContent = JSON.stringify(result, null, 2);

            let flightHTML = '';
            result.flights.forEach((flight, i) => {
                flightHTML += `<h3 class="success">Flight ${i + 1}:</h3><pre>`;
                flightHTML += `Airline: ${flight.airline}\n`;
                flightHTML += `Flight Number: ${flight.flightNumber}\n`;
                flightHTML += `From: ${flight.from || '<span class="error">EMPTY!</span>'}\n`;
                flightHTML += `To: ${flight.to || '<span class="error">EMPTY!</span>'}\n`;
                flightHTML += `Departure Time: ${flight.departureTime}\n`;
                flightHTML += `Arrival Time: ${flight.arrivalTime}\n`;
                flightHTML += `Duration: ${flight.duration}\n`;
                flightHTML += `Aircraft: ${flight.aircraft}\n`;
                flightHTML += `Baggage: ${flight.baggage}\n`;
                flightHTML += `</pre>`;
            });

            document.getElementById('flightDetails').innerHTML = flightHTML;

        } catch (error) {
            document.getElementById('result').innerHTML = `<span class="error">ERROR: ${error.message}\n${error.stack}</span>`;
        }
        }
    </script>
</body>
</html>
